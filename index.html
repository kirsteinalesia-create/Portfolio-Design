<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Alesia Katharina Kirstein · Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Portfolio of Alesia Katharina Kirstein: Digital Design, User Research and Concept Work at SAP." />

  <link rel="icon" href="favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Sacramento&family=Great+Vibes&family=Alex+Brush&family=Send+Flowers&family=Allura&family=Pinyon+Script&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/hero.css" />
</head>
<body>

  <!-- Intro Splash -->
  <div class="intro-splash" aria-hidden="true">
    <img src="assets/img/logo.png" alt="" />
  </div>

  <!-- Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand brand-lg" aria-label="Alesia Katharina Kirstein">
        <img src="assets/img/logo.png" alt="AK Alesia Katharina Kirstein" />
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="about.html">About me</a></li>
          <li><a href="work-sap.html">Work at SAP</a></li>
          <li><a href="work-dhbw.html">Work at DHBW</a></li>
          <li><a href="contact.html">Contacts</a></li>
          <li class="lang-switch">
            <button class="lang-btn" type="button" aria-label="Switch language / Sprache wechseln">
              <span class="lang-opt" data-lang="en">EN</span>
              <span class="lang-sep" aria-hidden="true">/</span>
              <span class="lang-opt" data-lang="de">DE</span>
            </button>
          </li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Open menu"><span></span></button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">

    <!-- Gradient Mesh: weiche Farbflecken im Hintergrund -->
    <div class="hero-mesh" aria-hidden="true">
      <div class="mesh-blob mesh-blob--1"></div>
      <div class="mesh-blob mesh-blob--2"></div>
      <div class="mesh-blob mesh-blob--3"></div>
    </div>

    <!-- Text-Content (im Container, links) -->
    <div class="container">
      <div class="hero-content">
        <span class="eyebrow">Welcome to my portfolio</span>

        <h1>
          <span class="line">Hello, I am</span>
          <span class="line"><span class="name">Alesia.</span></span>
        </h1>

        <p class="hero-tagline" style="margin-top: 36px;">
          I'm a UX design student at SAP &amp; DHBW Mannheim — driven by <b>curiosity</b> and a love for <b>detail</b>.
        </p>

        <div class="hero-actions">
          <a href="about.html" class="btn btn-primary">About me</a>
          <a href="contact.html" class="btn btn-outline">Contact me</a>
        </div>
      </div>
    </div>

    <!-- Visual-Layer: extends to right viewport edge -->
    <div class="hero-visual">

      <!-- Gestrichelte Orbit-Bahn: liegt GANZ HINTEN, damit Portrait + Kreise davor sind.
           viewBox 100×100 mit preserveAspectRatio="none" → Ellipse-Parameter sind
           direkte Prozente von hero-visual. Icons in .icon-orbit teilen dieselben
           Prozent-Werte per CSS und sitzen deshalb exakt auf dieser Bahn. -->
      <svg class="orbit-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="rose-gold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="#f0cdd0"/>
            <stop offset="40%"  stop-color="#e8c4b8"/>
            <stop offset="70%"  stop-color="#ddbba8"/>
            <stop offset="100%" stop-color="#f0cdd0"/>
          </linearGradient>
        </defs>
        <ellipse cx="60" cy="54" rx="45" ry="45"
                 fill="none"
                 stroke="url(#rose-gold)"
                 stroke-width="6"
                 stroke-dasharray="2 10"
                 stroke-linecap="round"
                 vector-effect="non-scaling-stroke"/>
      </svg>

      <!-- Brauner Kreis (hinten, versetzt nach oben-rechts, kommt am oberen Rand hervor) -->
      <div class="blob-brown"></div>

      <!-- Rosa Kreis (mittig, das Foto rundet ein) -->
      <div class="blob-pink"></div>

      <!-- Foto: Bilder-Stack. Jedes Bild sitzt in einem eigenen .photo-slot
           (Slide-Animation läuft auf dem Slot). Die Skalierung/Positionierung
           des <img> im Slot ist pro data-key so justiert, dass die Person auf
           allen Bildern gleich groß erscheint und die Füße/Grundlinie auf
           exakt derselben vertikalen Höhe liegen (siehe hero.css). -->
      <div class="photo-stage">
        <div class="photo-slot is-active" data-key="about">
          <img src="assets/img/Bild7.svg" alt="Portrait: About me" />
        </div>
        <div class="photo-slot" data-key="sap">
          <img src="assets/img/Bild3.svg" alt="Portrait: Work at SAP" />
        </div>
        <div class="photo-slot" data-key="dhbw">
          <img src="assets/img/Bild6.svg" alt="Portrait: Work at DHBW" />
        </div>
        <div class="photo-slot" data-key="contact">
          <img src="assets/img/Bild5.svg" alt="Portrait: Contact" />
        </div>
        <div class="photo-slot" data-key="hover" aria-hidden="true">
          <img src="assets/img/Bild4.svg" alt="" />
        </div>
      </div>

      <!-- Weiße geschwungene Rampe kreuzt die Kreise (unten) mit Social-Buttons -->
      <div class="white-ramp">
        <svg viewBox="0 0 1200 300" preserveAspectRatio="none">
          <path d="M -20 260 C 200 140, 460 310, 720 180 C 900 100, 1060 100, 1220 130 L 1220 320 L -20 320 Z" />
        </svg>

        <!-- Social-Buttons auf der Rampe -->
        <div class="social-dots">
          <a class="social-dot" href="mailto:alesia.kirstein@sap.com" aria-label="E-Mail" style="pointer-events:auto;">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7 l9 6 9-6"/></svg>
          </a>
          <a class="social-dot" href="https://teams.microsoft.com/l/chat/0/0?users=alesia.kirstein@sap.com" target="_blank" rel="noopener" aria-label="Microsoft Teams" style="pointer-events:auto;">
            <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="2.5"/><path d="M2 19v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><circle cx="17.5" cy="8.5" r="2"/><path d="M22 19v-1.5a4 4 0 0 0-3-3.85"/></svg>
          </a>
          <a class="social-dot" href="https://www.linkedin.com/in/alesia-katharina-kirstein-914929327/" target="_blank" rel="noopener" aria-label="LinkedIn" style="pointer-events:auto;">
            <svg viewBox="0 0 24 24"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
          </a>
        </div>
      </div>

      <!-- Icon-Orbit: elliptische Umlaufbahn um die Formgruppe (rosa + brauner Kreis).
           Die 5 Icons sitzen auf gleich verteilten Winkelpositionen (bearings) der Ellipse.
           Der Photo-Kompositions-Mittelpunkt ist gleichzeitig der Ellipsen-Mittelpunkt.
           Die gestrichelte SVG-Bahn liegt eine Ebene tiefer (siehe .orbit-path oben in
           hero-visual), damit Portrait + Kreise davor liegen.

           Die 5 Icons sind direkte Kinder von .hero-visual (nicht in .icon-orbit),
           damit sie garantiert nicht von einem Wrapper-Container blockiert werden können. -->

      <!-- Icon 1: About me -->
      <a href="about.html" class="icon-node" style="--bear: -48deg;" data-label="About">
        <svg viewBox="0 0 32 32"><circle cx="16" cy="12" r="5"/><path d="M6 27 c0-5 4.5-8 10-8 s10 3 10 8"/></svg>
        <span class="tip">About me</span>
      </a>

      <!-- Icon 2: Work at SAP -->
      <a href="work-sap.html" class="icon-node" style="--bear: -74deg;" data-label="SAP">
        <svg viewBox="0 0 32 32"><path d="M22 10 L13 19 c-1.4 1.4 0.7 3.5 2.1 2.1 L23 13 c2.8-2.8-1.4-7-4.2-4.2 L9 18 c-4.2 4.2 2.1 10.5 6.3 6.3 L23 16"/></svg>
        <span class="tip">Work at SAP</span>
      </a>

      <!-- Icon 3: Work at DHBW -->
      <a href="work-dhbw.html" class="icon-node" style="--bear: -100deg;" data-label="DHBW">
        <svg viewBox="0 0 32 32"><path d="M2 13 L16 6 L30 13 L16 20 Z"/><path d="M8 16 v6 c0 2 8 4 8 4 s8-2 8-4 v-6"/><path d="M30 13 v8"/><circle cx="30" cy="22" r="1"/></svg>
        <span class="tip">Work at DHBW</span>
      </a>



      <!-- Icon 5: Contact — bearing -140° (7 Uhr, unten) -->
      <a href="contact.html" class="icon-node" style="--bear: -126deg;" data-label="Contact">
        <svg viewBox="0 0 32 32"><rect x="4" y="8" width="24" height="18" rx="2"/><path d="M4 11 l12 8 12-8"/></svg>
        <span class="tip">Contact</span>
      </a>

    </div>

    <!-- Schleier-Bogen unten links -->
    <div class="hero-schleier-bl" aria-hidden="true">
      <img src="assets/img/di_striche_weiss.svg" alt="" />
    </div>

  </section>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/i18n.js"></script>
</body>
</html>
